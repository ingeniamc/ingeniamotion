ignore = [
    "undocumented-public-module", # Missing docstring in public module
    "undocumented-public-package", # Missing docstring in public package
    "undocumented-public-init", # Missing docstring in __init__
    "missing-trailing-comma", # Trailing comma. Already enforced by the formatter.
    "docstring-extraneous-exception", # Raises documented in docstring that are not explicit in the code
    "non-pep604-annotation-optional" # Optional[X] is compatible with Python 3.9; X | None requires 3.10+
]

[lint.per-file-ignores]
"__init__.py" = ["undefined-local-with-import-star"] # Import with wildcard (*)
