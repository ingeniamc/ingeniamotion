extend = "tools/rulesets/ruff/ruff.toml"
target-version = "py39"
exclude = ["tests/setups/tests_setup.py", "ingeniamotion/_version.py"]
extend-exclude = ["tools/rulesets"]

[lint]
pydocstyle.convention = "google"
flake8-unused-arguments.ignore-variadic-names = true


ignore = [
    "undocumented-public-module", # Missing docstring in public module
    "undocumented-public-package", # Missing docstring in public package
    "undocumented-public-init", # Missing docstring in __init__
    "missing-trailing-comma", # Trailing comma. Already enforced by the formatter.
    "docstring-extraneous-exception", # Raises documented in docstring that are not explicit in the code
    "non-pep604-annotation-optional" # Optional[X] is compatible with Python 3.9; X | None requires 3.10+
]
extend-select = [
    "complex-structure", # mccabe complexity
    "single-line-implicit-string-concatenation",
    "import-outside-top-level", # import-outside-top-level
]

[lint.per-file-ignores]
"__init__.py" = ["undefined-local-with-import-star"] # Import with wildcard (*)
"tests/*" = [
    "blank-line-after-function", # Docstring rules
    "blank-line-before-class",
    "blank-line-before-function",
    "blank-lines-between-header-and-content",
    "docstring-starts-with-this",
    "docstring-tab-indentation",
    "empty-docstring",
    "empty-docstring-section",
    "escape-sequence-in-docstring",
    "first-word-uncapitalized",
    "incorrect-blank-line-after-class",
    "incorrect-blank-line-before-class",
    "incorrect-section-order",
    "mismatched-section-underline-length",
    "missing-blank-line-after-last-section",
    "missing-blank-line-after-summary",
    "missing-dashed-underline-after-section",
    "missing-new-line-after-section-name",
    "missing-section-name-colon",
    "missing-section-underline-after-name",
    "missing-terminal-punctuation",
    "missing-trailing-period",
    "multi-line-summary-first-line",
    "multi-line-summary-second-line",
    "new-line-after-last-paragraph",
    "no-blank-line-after-section",
    "no-blank-line-before-section",
    "non-capitalized-section-name",
    "non-imperative-mood",
    "over-indentation",
    "overindented-section",
    "overindented-section-underline",
    "overload-with-docstring",
    "property-docstring-starts-with-verb",
    "signature-in-docstring",
    "surrounding-whitespace",
    "triple-single-quotes",
    "under-indentation",
    "undocumented-magic-method",
    "undocumented-param",
    "undocumented-public-class",
    "undocumented-public-function",
    "undocumented-public-init",
    "undocumented-public-method",
    "undocumented-public-module",
    "undocumented-public-nested-class",
    "undocumented-public-package",
    "unnecessary-multiline-docstring",
]
