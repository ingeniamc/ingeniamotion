[pytest]
testpaths = tests
markers =
    develop: test in develop
    ethernet: ethernet protocol
    soem: soem protocol
    soem_multislave: soem protocol with multislave
    canopen: canopen protocol
    virtual: Tests without connection
    fsoe: Safety over EtherCAT
    fsoe_phase2: Safety over EtherCAT phase 2 tests
    valid_versions_for_product: Specify valid firmware version range for a specific product (part_number, min=version, max=version)
    not_valid_for_product: Specify part number for which the test should never run
log_cli = False
log_cli_level = INFO
env=
    D:RESOURCES_DIR=resources
    D:WIRESHARK_DIR=wireshark
    D:CLEAR_WIRESHARK_LOG_IF_SUCCESSFUL=true
    D:WIRESHARK_INSTALLATION_PATH=C:\\Program Files\\Wireshark
    D:WIRESHARK_SCOPE=function
    D:START_WIRESHARK_TIMEOUT_S=10.0
    D:START_TEST_TIMESTAMP_WAIT_S=0.1
    D:END_TEST_TIMESTAMP_WAIT_S=0.5
